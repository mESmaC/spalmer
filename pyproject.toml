[project]
name = "spalmer"
version = "0.1.0"
description = "Surprise-Potentiated Addressed Linear Micro-Expert Routing Transformer"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Cameron Emery" },
]
dependencies = [
    "torch>=2.6",
]

[project.scripts]
spalmer = "spalmer.__main__:main"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spalmer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "W"]
